name: Check course website
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-cloud.txt pytest
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python tools/export_online.py
      - run: node tools/export_scripts.mjs
      - run: node tools/export_physical.mjs
      - run: python -m pytest tests/test_lab.py tests/test_cloud.py tests/test_online.py -q
      - run: npm test
      - run: npm run build
